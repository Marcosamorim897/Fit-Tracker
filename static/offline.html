<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem conexão · FitTracker</title>
  <style>
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f6f5f2; color: #24211e;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; text-align: center; padding: 1.5rem;
    }
    .box { max-width: 380px; }
    .emoji { font-size: 3.2rem; }
    h1 { font-size: 1.4rem; margin: 0.8rem 0 0.4rem; }
    p { color: #7a746c; }
    button {
      margin-top: 1rem; padding: 0.6rem 1.4rem; font-size: 1rem;
      background: #e8590c; color: #fff; border: none; border-radius: 10px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">📴</div>
    <h1>Você está sem conexão</h1>
    <p>O FitTracker precisa de internet para carregar seus treinos.
       Verifique sua conexão e tente de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
