{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth-card card">
  <h2>Entrar</h2>
  <form method="post">
    <label>E-mail
      <input type="email" name="email" required value="{{ request.form.email or '' }}">
    </label>
    <label>Senha
      <input type="password" name="password" required>
    </label>
    <label class="checkbox">
      <input type="checkbox" name="remember" checked> Manter conectado
    </label>
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
  </form>
  <p class="muted">Ainda não tem conta? <a href="{{ url_for('register') }}">Cadastre-se</a></p>
</div>
{% endblock %}
